name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Verify TITAN engine file
        run: |
          set -e
          mkdir -p app/src/main/python
          # Accept file at either location
          if [ -f TITAN_PRO_V75_PWA.py ] && [ ! -f app/src/main/python/TITAN_PRO_V75_PWA.py ]; then
            cp TITAN_PRO_V75_PWA.py app/src/main/python/
          fi
          if [ ! -f app/src/main/python/TITAN_PRO_V75_PWA.py ]; then
            echo "ERROR: TITAN_PRO_V75_PWA.py is missing."
            echo "Upload it to: app/src/main/python/TITAN_PRO_V75_PWA.py"
            exit 1
          fi
          wc -c app/src/main/python/TITAN_PRO_V75_PWA.py
          test -s app/src/main/python/TITAN_PRO_V75_PWA.py
          test -f app/src/main/python/titan_bootstrap.py
          head -c 40 app/src/main/python/TITAN_PRO_V75_PWA.py; echo

      - name: Gradle wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=120000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: titan-v75-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
